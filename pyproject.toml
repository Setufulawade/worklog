[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "worklog"
version = "0.2.0"
description = "A daily work journal for the terminal with AI reports and PowerPoint export"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
ppt = ["python-pptx"]

[project.scripts]
worklog = "worklog.cli:main"

[tool.setuptools]
packages = ["worklog"]
